<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="description" content="Tus fotos de viaje sobre un globo 3D interactivo." />
		<meta name="theme-color" content="#070b14" />
		<!-- Link previews (LinkedIn, WhatsApp...); the image needs an absolute URL -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://waymark.aleixaj.com/" />
		<meta property="og:title" content="Waymark · Tus fotos de viaje en un globo 3D" />
		<meta property="og:description" content="Lee el GPS de tus fotos, detecta tus viajes y los muestra en un globo 3D por país, ciudad y barrio. Demo sin registro." />
		<meta property="og:image" content="https://waymark.aleixaj.com/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<!-- The page is dark from its very first frame (no white flash while it loads);
		     the light theme sets its own background once the styles arrive -->
		<style>
			html {
				background: #070b14;
			}
		</style>
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
